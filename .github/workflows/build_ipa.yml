name: Build HexCore Labs IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build .app (unsigned)
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual 2>&1

      - name: Find and package .app into IPA
        run: |
          APP_PATH=$(find ios/App/build -name "App.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner -name "App.app" -type d -maxdepth 10 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            echo "=== Build output ==="
            find ios/App/build -maxdepth 6 -type d 2>/dev/null || echo "(empty)"
            echo "=== DerivedData ==="
            find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -name "*.app" -type d 2>/dev/null || echo "(none)"
            exit 1
          fi
          echo "Using .app: $APP_PATH"
          echo "Converting Info.plist to XML..."
          plutil -convert xml1 "$APP_PATH/Info.plist"
          echo "Ad-hoc signing..."
          codesign --force --sign - "$APP_PATH" 2>&1
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r HexCoreLabs.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HexCoreLabs-iOS
          path: HexCoreLabs.ipa
